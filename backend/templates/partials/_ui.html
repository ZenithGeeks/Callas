{# Shared pieces. Server pages call these directly; the live page prints them inside <template>
   tags and live.js fills the data-slot parts. State styling lives in static/src/app.css. #}

{% macro warn_icon(cls="") %}
<svg class="{{ cls }}" viewBox="0 0 64 56" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M32 6 L59 51 H5 Z"/></svg>
{%- endmacro %}

{% macro check_icon(cls="") %}
<svg class="{{ cls }}" viewBox="0 0 64 56" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M7 29 L25 47 L58 9"/></svg>
{%- endmacro %}

{% macro stop_icon(cls="") %}
<svg class="{{ cls }}" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/></svg>
{%- endmacro %}

{% macro play_icon(cls="") %}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z"/></svg>
{%- endmacro %}

{% macro arrow_icon() %}
<svg class="inline-block h-[11px] w-[16px] align-baseline" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M1 5.5 H14 M10 1.5 L14.5 5.5 L10 9.5"/></svg>
{%- endmacro %}

{# Halftone dot field: soft alarm-line dots growing toward the bottom-right corner. #}
{% macro halftone() %}
<svg class="pointer-events-none absolute bottom-0 right-0 hidden h-[96px] w-[192px] opacity-70 lg:block" viewBox="0 0 300 150" aria-hidden="true">
  {% for row in range(8) %}{% for col in range(16) %}
  {% set d = (15 - col) + (7 - row) * 1.4 %}
  {% set r = 6.5 - d * 0.3 %}
  {% if r > 0.9 %}<circle cx="{{ col * 19 + 9 }}" cy="{{ row * 19 + 9 }}" r="{{ '%.1f' % r }}" fill="var(--alarm-line)"/>{% endif %}
  {% endfor %}{% endfor %}
</svg>
{%- endmacro %}

{# Hand-drawn pen circle: two slightly rotated ellipses. `box` positions it over its parent. #}
{# shape "loop": a rounded hand-drawn loop that hugs a text block without crossing its corners. #}
{% macro pen(box="", halo=False, shape="ellipse") %}
<span class="pointer-events-none absolute {{ box }}" aria-hidden="true"><svg class="pen" viewBox="0 0 100 100" preserveAspectRatio="none" fill="none" stroke="var(--alarm)" stroke-linecap="round" aria-hidden="true" data-pen>
  {% if halo %}{# surface-coloured under-stroke so the circle stays visible where it crosses the solid bar #}
  <ellipse cx="50" cy="50" rx="49" ry="47" transform="rotate(-1.6 50 50)" stroke="var(--surface)" stroke-width="6" vector-effect="non-scaling-stroke"/>
  {% endif %}
  {% if shape == "loop" %}
  <rect x="0.6" y="1.5" width="98.8" height="97" rx="7" ry="30" transform="rotate(-0.5 50 50)" stroke-width="2" vector-effect="non-scaling-stroke" pathLength="100"/>
  <rect x="1.1" y="0.8" width="98" height="97.8" rx="8" ry="34" transform="rotate(0.7 50 50)" stroke-width="1" stroke-opacity=".45" vector-effect="non-scaling-stroke" pathLength="100"/>
  {% else %}
  <ellipse cx="50" cy="50" rx="49" ry="47" transform="rotate(-1.6 50 50)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <ellipse cx="50" cy="50" rx="48.4" ry="46" transform="rotate(1.9 50 50)" stroke-width="1" stroke-opacity=".45" vector-effect="non-scaling-stroke"/>
  {% endif %}
</svg></span>
{%- endmacro %}

{% macro head(title, sub="", rule=False) %}
<div class="flex flex-wrap items-baseline gap-x-4 gap-y-1 {% if rule %}sec-rule{% endif %}">
  <h2 class="sec-h">{{ title }}</h2>
  {% if sub %}<p class="text-[15px] leading-[1.5] text-muted">{{ sub }}</p>{% endif %}
</div>
{%- endmacro %}

{# Verdict band. b is a views.Band. #}
{% macro band(b) %}
<section class="band {% if b.fresh %}is-fresh{% endif %} px-8 py-8 lg:px-10 lg:py-10 min-h-[200px] lg:min-h-[273px]" data-kind="{{ b.kind }}" role="status" aria-live="polite" data-band>
  {% if b.kind == 'scam' %}{{ halftone() }}{% endif %}
  <div class="band-grid">
    <div class="band-main">
      <div class="verdict-row">
        {% if b.kind == 'safe' %}{{ check_icon("verdict-icon") }}{% else %}{{ warn_icon("verdict-icon") }}{% endif %}
        <p class="verdict-word" data-slot="word">{{ b.word }}</p>
      </div>
      <p class="verdict-sub mt-3 lg:mt-4" data-slot="subtype">{{ b.subtype }}</p>
      <p class="mt-3 text-[18px] leading-[1.5] lg:text-[20px]" data-slot="instruction">{{ b.instruction }}</p>
      {% if b.inline_fact %}<p class="band-inline mt-3 text-[16px] leading-[1.5]" data-slot="inline">{{ b.inline_fact }}</p>{% endif %}
    </div>
    <div class="band-facts">
      <p class="fact-label" data-slot="fact-label">{{ b.fact_label }}</p>
      <p class="big-fact mt-3" data-slot="fact-big">{{ b.fact_big }}</p>
      <p class="mt-3 text-[16px] leading-[1.5]" data-slot="fact-note">{{ b.fact_note }}</p>
      <p class="mt-3 font-display text-[16px] font-semibold text-ink" data-slot="fact-extra">{{ b.fact_extra }}</p>
    </div>
  </div>
</section>
{%- endmacro %}

{# Empty state: a quiet ruled block, never a fake verdict. #}
{% macro placeholder(title, text) %}
<section class="flex min-h-[200px] flex-col justify-center rounded-[20px] bg-paper px-8 py-8 lg:min-h-[273px] lg:px-10" data-placeholder>
  <p class="font-display text-[34px] font-semibold leading-[1.2] text-ink lg:text-[44px]">{{ title }}</p>
  <p class="mt-2 max-w-[56ch] text-[18px] leading-[1.6] text-muted">{{ text }}</p>
</section>
{%- endmacro %}

{# Numbered stage row. state: idle | busy | scam | safe. #}
{% macro stage(n, name, desc, state="idle", right="", tone="") %}
<li class="stage" data-state="{{ state }}" data-stage="{{ n }}">
  <span class="stage-box" aria-hidden="true"><span class="stage-num">{{ n }}</span><svg class="stage-check" viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5 L9.5 17 L19 7"/></svg></span>
  <div class="min-w-0">
    <p class="stage-name" data-slot="name">{{ name }}</p>
    <p class="stage-desc" data-slot="desc">{{ desc }}</p>
  </div>
  <span class="stage-right" data-slot="right" {% if tone %}data-tone="{{ tone }}"{% endif %}>{{ right }}</span>
</li>
{%- endmacro %}

{# One bar in a strip well. state: normal | scam | held | live | idle. #}
{% macro bar(state, height=40, label="") %}
<div class="bar" data-state="{{ state }}" style="--h: {{ height }}%">{% if state == 'live' %}<span>{{ label }}</span>{% endif %}</div>
{%- endmacro %}

{# One strip column: well, T label, You/Caller label. #}
{% macro strip_col(n, who, state, height=40, label="", circled=False, fresh=False) %}
<div class="relative min-w-0 flex-1 {% if circled and fresh %}is-fresh{% endif %}" data-turn="{{ n }}">
  <div class="well">{{ bar(state, height, label) }}{% if circled %}{{ pen("-left-2 -right-2 -top-2 -bottom-2", halo=True) }}{% endif %}</div>
  <p class="mt-3 text-center font-display text-[14px] font-semibold leading-[1.3] lg:text-[15px] {% if circled %}text-alarm{% endif %}" data-slot="tlabel">T{{ n }}</p>
  <p class="text-center text-[13px] leading-[1.4] text-muted lg:text-[15px]" data-slot="who">{{ who }}</p>
</div>
{%- endmacro %}

{% macro legend() %}
<ul class="mt-5 flex flex-wrap gap-x-6 gap-y-2 text-[15px] text-muted">
  <li><span class="swatch bg-safe"></span>Normal</li>
  <li><span class="swatch bg-alarm"></span>Scam found</li>
  <li><span class="swatch swatch-held"></span>Held as escalated</li>
</ul>
{%- endmacro %}

{# Transcript text with entity underlines. segs come from views.segments(). #}
{% macro marked(segs) -%}
{%- for s in segs -%}{%- if s.label -%}<span class="ent" data-tone="{{ s.tone }}" data-label="{{ s.label }}">{{ s.text }}</span>{%- else -%}{{ s.text }}{%- endif -%}{%- endfor -%}
{%- endmacro %}

{# One transcript row. state: pending | partial | normal | scam | held. #}
{% macro trow(n, speaker, time, segs, state="normal", tag="", tone="", circled=False, fresh=False) %}
<li class="trow {% if circled and fresh %}is-fresh{% endif %}" data-state="{{ state }}" data-speaker="{{ speaker }}" data-turn="{{ n }}">
  <span class="badge" data-slot="speaker">{{ speaker }}</span>
  <div class="trow-label">
    <p class="trow-turn">Turn <span data-slot="n">{{ n }}</span></p>
    <p class="trow-time" data-slot="time">{{ time }}</p>
  </div>
  <p class="trow-text" lang="th" data-slot="text">{{ marked(segs) }}{% if state == 'partial' %}<span class="caret" aria-hidden="true"></span>{% endif %}{% if circled %}{{ pen("-left-3 -right-3 -top-1.5 -bottom-1.5", shape="loop") }}{% endif %}</p>
  <span class="trow-tag" {% if tone %}data-tone="{{ tone }}"{% endif %} data-slot="tag">{{ tag }}</span>
</li>
{%- endmacro %}

{% macro entity_list(rows, empty="No entities found yet.") %}
{% if rows %}
<ul>
  {% for r in rows %}
  <li class="erow"><span class="etag" {% if r.sensitive %}data-tone="alarm"{% endif %}>{{ r.tag }}</span><span class="evalue" lang="th">{{ r.text }}</span></li>
  {% endfor %}
</ul>
{% else %}
<p class="py-4 text-[15px] text-muted">{{ empty }}</p>
{% endif %}
{%- endmacro %}

{% macro summary_box(text, empty="The summary appears here.") %}
<div class="rounded-[16px] bg-paper px-5 py-7">
  <h2 class="sec-h">Summary</h2>
  {% if text %}<p class="mt-4 text-[19px] leading-[30px]" lang="th">{{ text }}</p>{% else %}<p class="mt-3 text-[15px] text-muted">{{ empty }}</p>{% endif %}
</div>
{%- endmacro %}

{# Real tokens of one step (data_pipeline.usage): "in 2,846 · out 512 · 2 requests". #}
{% macro step_tokens(u) -%}
{% if u %}<span lang="en">In {{ "{:,}".format(u.input) }} · out {{ "{:,}".format(u.output) }} tokens{% if u.requests > 1 %} · {{ u.requests }} requests{% endif %}{% if u.failed %} ({{ u.failed }} failed){% endif %}</span>{% endif %}
{%- endmacro %}
