[project]
name = "callas"
version = "0.1.0"
description = "A guard for Thai scam calls and messages"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
]

[project.optional-dependencies]
asr = [
    "pythaiasr>=2.2",
    "onnxruntime>=1.18",
    "soundfile>=0.12",
]
tts = [
    "pythaitts>=0.6",
    "fastthaig2p[tts] @ git+https://github.com/awslabs/FastThaiG2P.git",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["modules", "."]
testpaths = ["modules", "backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["asr_diarization", "callas_settings", "llm_serving", "nlp_core", "orchestrator", "tts_voice_agent", "backend"]
