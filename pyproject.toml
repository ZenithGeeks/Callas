[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "callas"
version = "0.1.0"
description = "A guard for Thai scam calls and messages"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
]

[project.optional-dependencies]
asr = [
    "pythaiasr>=2.2",
    "onnxruntime>=1.18",
    "soundfile>=0.12",
]
tts = [
    "pythaitts>=0.6",
    "fastthaig2p[tts] @ git+https://github.com/awslabs/FastThaiG2P.git",
]
dspy = [
    "dspy>=3.4",
]
ml = [
    # Install torch first from the CUDA index; the PyPI wheel on Windows is CPU only:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu128
    "torch>=2.7",
    "transformers>=4.46",
    "accelerate>=1.0",
    "pythainlp>=5.0",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "notebook>=7.2",
    "ipykernel>=6.29",
]
scrape = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "modules" }
py-modules = ["callas_settings"]

[tool.setuptools.packages.find]
where = ["modules"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
pythonpath = ["modules", "."]
testpaths = ["modules", "backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells keep chart calls and Thai example strings on one line.
"notebooks/*.ipynb" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["asr_diarization", "callas_settings", "llm_serving", "nlp_core", "orchestrator", "tts_voice_agent", "backend", "conftest"]
