# Made-up values that fill the slots the agents write ({PHONE}, {URL}, ...).
#
# Each call draws its own values from its seed and keeps them for the whole call. Phone numbers,
# account numbers and OTPs are random digits (see fill.py); links are built from the words
# below, so no real number or link from the model's memory reaches the data.
#
#   names         first names by gender, for {CALLER_NAME} and {RECEIVER_NAME}
#   nicknames     used instead of names in calls whose scenario relation is a nickname one
#                 (fill.NICKNAME_RELATIONS: a close friend or family member)
#   banks         {ORG} when a scenario's org is "ธนาคาร"
#   made_up_orgs  {ORG} when a scenario's org is "*"
#   podcasts      {ORG} when a scenario's org is "พอดแคสต์" (made-up podcast names)
#   schools       {ORG} when a scenario's org is "โรงเรียน" (made-up school names)
#   police_stations {ORG} when a scenario's org is "สถานีตำรวจ" (made-up station names)
#   urls          {URL} = https://<word>-<word><2 digits>.<tld>
#   line_ids      {LINE_ID} = <part><part>, two different parts, lowercase letters only
#
# The caller's {CARD_NUMBER} (a card it says the receiver has) is 16 random digits as
# 1234-5678-9012-3456 that never pass the Luhn check (see fill.py), so it needs no list here.
#   money         {MONEY} in baht; big_types use the big amounts
#   addresses     the receiver's {ADDRESS} = <house number> ซอย<soi> <district> <province>
#
# The receiver also has its own made-up {RECEIVER_PHONE}, {RECEIVER_ACCOUNT}, {ID_CARD}
# (random digits, never a valid real ID number) and {BIRTH_DATE} (matches its age); these
# are random too, and the receiver agent may give them away (see README, Receiver leaks).

