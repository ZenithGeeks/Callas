# What simulated calls are about and who answers them.
#
# The label of a call comes from here, never from the model: `scams.<type>` scenarios make
# scam calls of that type, `legit` scenarios make normal calls. Keep the 5 scam types as they
# are (they are the spec's label_type values); add or edit scenarios freely.
#
# Scenario fields:
#   key      short unique id, stored in each record
#   role     who the caller says they are
#   org      organisation named in the call: a name, "ธนาคาร" (a random real bank),
#            "*" (a made-up company), or leave it out for none
#   goal     what the caller wants by the end of the call
#   tactics  how the caller gets there (for legit calls: how they handle the call)
# Text may use slots like {MONEY} or {URL}; the loader rejects unknown slots.
#
# Seeds pick scenarios and receivers by list position, so adding an item in the middle changes
# which call a seed makes. Records store the config hash, so old and new data stay apart.

scams:
  fake_authority:
  - key: police_warrant
    role: police officer from a central investigation unit
    org: กองบัญชาการตำรวจสอบสวนกลาง
    goal: get the receiver to read out their ID card number and bank account number 'to verify
      identity', then move their money to {BANK_ACCOUNT} 'for checking'
    tactics: says the receiver's bank account was used for money laundering, threatens arrest, forbids
      telling family, offers to 'clear the name' if money is moved now
  - key: dsi_case
    role: DSI investigator
    org: กรมสอบสวนคดีพิเศษ
    goal: get the receiver to read out their ID card number and birth date 'to match the case
      file', then add a LINE contact and transfer {MONEY}
    tactics: claims a parcel in the receiver's name held drugs or fake passports, transfers the call to
      a 'senior officer', asks for a video call statement
  - key: revenue_tax
    role: tax officer
    org: กรมสรรพากร
    goal: get the receiver to open {URL} and install an app to 'claim a tax refund'
    tactics: says the receiver is owed a refund that expires today, guides step by step
  - key: electricity_bill
    role: officer of the electricity authority
    org: การไฟฟ้า
    goal: get the receiver to pay {MONEY} to {BANK_ACCOUNT} or add a LINE account
    tactics: says a bill is overdue or a deposit refund is waiting, threatens to cut power today
  - key: court_summons
    role: court clerk
    org: ศาล
    goal: get the receiver to confirm their ID card number and address 'to find the case', then
      call back {PHONE} and pay a 'fine' of {MONEY}
    tactics: says the receiver missed a court date about an unpaid card, warns of a warrant
  - key: customs_parcel
    role: customs officer
    org: กรมศุลกากร
    goal: get the receiver to pay a 'customs fee' of {MONEY} to {BANK_ACCOUNT}
    tactics: says a parcel from abroad is held, adds pressure that it will be seized tomorrow
  - key: ransom_isolation
    role: police officer, teacher, or government official
    goal: get the receiver to transfer {MONEY} to {BANK_ACCOUNT} to pay a 'ransom' or avoid consequences
    tactics: Claim to be a police officer, teacher, or official; Order the victim to keep the matter secret
      and isolate them from family or friends; Create various reasons or use psychological pressure to force
      a quick transfer; Threaten or persuade the victim to send money immediately
  - key: fake_mea_meter_change
    role: Officer of the Metropolitan Electricity Authority (MEA)
    org: การไฟฟ้านครหลวง
    goal: get the receiver to provide ID card, house registration, and meter number to 'refund' meter insurance
    tactics: Call the victim claiming to be an MEA officer; State the need to change the electricity meter;
      Ask for personal documents (ID, house registration, meter number); Promise a refund for meter insurance
  - key: fake_deposit_protection_line
    role: fake Deposit Protection Fund official
    org: สถาบันคุ้มครองเงินฝาก
    goal: get the receiver to provide personal information or transfer money via a fake LINE account
    tactics: Create a fake LINE account named 'ข่าวสารประชาสัมพันธ์'; Impersonate the Deposit Protection
      Fund and its officials; Request personal data, invite to LINE groups, or send fake links to steal
      data or money
  - key: fake_appliance_service
    role: appliance service company staff
    goal: get the receiver to provide personal details or pay {MONEY} in advance for service
    tactics: Call victims citing hot weather and potential appliance issues; Offer to check, replace, or
      repair appliances; Ask for personal details or advance payment; Schedule a home visit without verifying
      identity
  - key: fake_loan_verification_fee
    role: Loan officer or credit institution staff
    goal: get the receiver to transfer {MONEY} to {BANK_ACCOUNT} to 'verify the account' and get loan approval
    tactics: Contact victims who have been rejected for loans; Claim that credit history needs to be fixed
      or account verified; Ask for a transfer to prove the account is active
  - key: official_line_loan
    role: high-ranking government official (e.g., Minister, MP, Mayor)
    org: กระทรวงเกษตรและสหกรณ์
    goal: get the victim to transfer {MONEY} to {BANK_ACCOUNT} as a loan
    tactics: Impersonate a government official using their name and photo on LINE; Send a message asking
      for a loan for a specific reason (e.g., public works, personal need); Exploit the victim's trust in
      the official's status
  - key: post_illegal_parcel_case
    role: Thailand Post officer
    org: บริษัท ไปรษณีย์ไทย จำกัด
    goal: get the receiver to transfer {MONEY} to 'close the case' regarding illegal goods
    tactics: Call the victim using a spoofed official number; Claim the victim received illegal items in
      a parcel; Offer to close the legal case in exchange for a payment; Request a bank transfer to settle
      the matter
  - key: fake_ministry_link_call
    role: Digital Ministry officer
    goal: get the receiver to click a malicious link sent via phone
    tactics: Call the victim claiming to be from the Digital Ministry; Send a link via SMS or message; Instruct
      the victim to click the link
  - key: vaccine_followup_scam
    role: vaccine center staff
    org: สำนักงานปลัดกระทรวงสาธารณสุข
    goal: get the victim to provide personal information such as ID card number and bank account
    tactics: Call the victim claiming to be from a vaccine center; Ask about post-vaccination symptoms to
      build trust; Request personal data like ID card and bank account numbers
  - key: post_parcel_issue
    role: Thailand Post officer
    org: บริษัท ไปรษณีย์ไทย จำกัด
    goal: get the receiver to pay a fee or provide personal details to resolve the 'parcel problem'
    tactics: Call the victim using a fake number; Claim the victim's parcel has an issue or problem; Create
      urgency to resolve the issue immediately; Ask for payment or personal information
  - key: bank_account_closure_threat
    role: Krungthai Bank officer
    org: ธนาคารกรุงไทย
    goal: get the receiver to comply with the threat to close the account or provide information
    tactics: Call the victim claiming to be from Krungthai Bank; Threaten to close the bank account; Use
      a non-bank phone number
  - key: fake_bank_phone_inquiry
    role: Bangkok Bank officer
    org: ธนาคารกรุงเทพ
    goal: get the receiver to disclose personal information over the phone
    tactics: Call the victim claiming to be from Bangkok Bank; Ask for personal details; Use a non-bank
      phone number
  - key: fake_gov_project
    role: Officer from the Ministry of Finance
    org: กระทรวงการคลัง
    goal: get the receiver to click a link to cancel rights for a government project
    tactics: Call the victim claiming to be from the Ministry of Finance; Inform about a government project;
      Ask to click a link to cancel rights
  - key: gov_stimulus_data_scam
    role: Ministry of Finance official
    org: กระทรวงการคลัง
    goal: get the victim to provide ID card number and bank account number
    tactics: Call the victim from a mobile number; Claim to be from the Ministry of Finance; Ask for ID
      card and bank account numbers to disburse stimulus money
  - key: pea_meter_upgrade_line
    role: officer of the Provincial Electricity Authority (PEA)
    org: การไฟฟ้าส่วนภูมิภาค
    goal: get the receiver to confirm their full name via LINE to 'verify identity' for a digital meter
      upgrade
    tactics: Call the victim claiming to be from PEA; Inform them that their electricity meter is being
      upgraded to a digital one; Ask the victim to add a LINE contact and confirm their full name
  - key: fake_land_dept_line_contact
    role: fake Land Department official
    org: กรมที่ดิน
    goal: get the receiver to provide personal information via LINE chat
    tactics: Contact the victim via a fake LINE account named '{URL} เอกสาร'; Impersonate a Land Department
      official; Request personal data or documents
  - key: mof_stimulus_data_collection
    role: Ministry of Finance officer
    org: กระทรวงการคลัง
    goal: get the receiver to provide ID card number and bank account number to 'receive' stimulus money
    tactics: Call the victim using a fake number; Claim to be from the Ministry of Finance; Ask for ID card
      number and bank account number; Use the data for identity theft or further fraud
  romance:
  - key: engineer_abroad
    role: someone met on a dating app who says they are an engineer working abroad
    goal: get the receiver to pay {MONEY} 'customs tax' for a gift parcel
    tactics: warm and personal for several turns, talks about a future together, then the parcel is stuck
      and only the receiver can help
  - key: soldier_mission
    role: someone met online who says they are a soldier on a peace mission
    goal: get the receiver to send {MONEY} so the caller can take leave and visit
    tactics: affectionate, mentions loneliness and danger, asks for secrecy
  - key: hospital_emergency
    role: an online partner of some months
    goal: get an urgent transfer of {MONEY} to {BANK_ACCOUNT} for a hospital bill
    tactics: sounds distressed, says their own card is blocked, promises to pay back next week
  - key: partner_investment
    role: an online partner who says they trade crypto
    goal: get the receiver to register at {URL} and deposit {MONEY}
    tactics: slow trust building, shows own 'profits', suggests building a future fund together
  - key: identity_hijack_emergency
    role: victim's friend or family member (impersonated)
    goal: get the receiver to transfer {MONEY} to {BANK_ACCOUNT} to help with an 'emergency'
    tactics: Collect personal data and photos from social media; Create a fake account using the victim's
      identity; Contact the victim's friends or family; Claim to be in an emergency and ask for financial
      help
  investment:
  - key: gold_signal
    role: investment advisor from a gold trading company
    org: '*'
    goal: get the receiver to join a LINE group and open an account at {URL}
    tactics: promises a fixed 30% monthly return, cites famous people, limited seats today
  - key: stock_vip
    role: staff of a 'VIP stock club'
    org: '*'
    goal: get a first deposit of {MONEY} to {BANK_ACCOUNT}
    tactics: gives a small free tip first, mentions members' profits, pushes a deadline
  - key: crypto_mining
    role: crypto mining fund agent
    org: '*'
    goal: get the receiver to buy a 'mining package' for {MONEY}
    tactics: explains daily payouts, shows a dashboard at {URL}, says the price rises tomorrow
  - key: task_job
    role: recruiter for online part-time tasks
    org: '*'
    goal: get the receiver to pay {MONEY} to 'unlock' higher paying tasks
    tactics: pays a small first reward, then asks for top-ups before withdrawal
  phishing_otp:
  - key: bank_security
    role: bank security staff
    org: ธนาคาร
    goal: get the OTP the receiver just received by SMS
    tactics: says someone is trying to log in to the receiver's account, needs the OTP to block it
  - key: card_points
    role: credit card staff
    org: ธนาคาร
    goal: get the receiver to open {URL} through SMS and enter card details to redeem expiring points
    tactics: points expire today, the gift is valuable, the link is 'official'
  - key: delivery_redelivery
    role: delivery company staff
    org: '*'
    goal: get the receiver to open {URL} and pay a small re-delivery fee by card
    tactics: a parcel failed delivery, address must be confirmed through the link
  - key: app_update
    role: mobile banking support
    org: ธนาคาร
    goal: get the receiver to install an app from {URL} and read the OTP
    tactics: says the banking app must be updated today or it will be locked
  - key: telco_sim
    role: mobile network staff
    org: '*'
    goal: get the OTP to 'move the SIM to a new card'
    tactics: says the SIM will be cut off today unless re-registered
  - key: dbd_business_data_update
    role: officer of the Department of Business Development
    org: กรมพัฒนาธุรกิจการค้า
    goal: get the receiver to open {URL} and update their business registration data to 'verify identity'
      or avoid penalties
    tactics: Call the victim or send a fake official letter via social media; Claim that the business registration
      data needs to be updated urgently; Direct the victim to a fake website resembling the official DBD
      site; Ask for personal or business details to 'complete the update'
  - key: fake_pension_verification
    role: government official (impersonated)
    goal: get the receiver to reveal personal data or click {URL} to 'verify pension details'
    tactics: Call the victim claiming to be an official; State that the pension has a problem or needs urgent
      verification; Use the name of a trusted agency to build credibility; Ask the victim to reveal important
      data or click a fake link
  lottery:
  - key: gov_lottery
    role: staff of a lottery prize office
    org: สำนักงานสลากกินแบ่งรัฐบาล
    goal: get the receiver to pay a 'tax and fee' of {MONEY} before the prize is released
    tactics: congratulates loudly, says the prize is large, the fee must be paid today
  - key: shopping_draw
    role: staff of an online shopping platform
    org: '*'
    goal: get the receiver to pay {MONEY} 'shipping and insurance' for a won car or phone
    tactics: the receiver was picked in a customer draw, asks to keep it quiet until delivered
  - key: brand_anniversary
    role: marketing staff of a drink brand
    org: '*'
    goal: get the receiver to open {URL} and fill in bank details to receive prize money
    tactics: anniversary campaign, random phone numbers won, deadline tonight
  - key: lucky_sim
    role: telecom promotion staff
    org: '*'
    goal: get the receiver to transfer {MONEY} to {BANK_ACCOUNT} to 'activate' a prize
    tactics: the receiver's number won a lucky draw, tone friendly then urgent
# Normal calls. Several are hard cases on purpose: they mention OTPs, accounts or money, as
# real banks and couriers do, so the classifier cannot learn "a bank is mentioned = scam".
legit:
- key: bank_fraud_alert
  role: bank fraud team
  org: ธนาคาร
  goal: check whether the receiver made a card payment of {MONEY}; if not, block the card
  tactics: asks only yes or no, says the bank never asks for the OTP or PIN, offers that the receiver
    call back the number on the back of the card
- key: courier_address
  role: courier
  org: '*'
  goal: confirm the receiver is home to receive a parcel today
  tactics: names the shop, asks for a landmark, no payment
- key: cod_delivery
  role: courier with a cash-on-delivery parcel
  org: '*'
  goal: check the receiver ordered a COD parcel of {MONEY} before delivering
  tactics: says the receiver may refuse the parcel if they did not order it
- key: hospital_reminder
  role: hospital staff
  org: โรงพยาบาล
  goal: remind the receiver of an appointment tomorrow and to fast before a blood test
  tactics: polite, gives the clinic phone {PHONE} for changes
- key: police_witness
  role: local police officer
  org: สถานีตำรวจ
  goal: ask the receiver to come to the station to give a witness statement about a car accident
  tactics: never asks for money, gives the station number {PHONE} and says to call it to verify
- key: insurance_renewal
  role: insurance agent the receiver already uses
  org: '*'
  goal: remind the receiver their car insurance ends next week and offer to send the renewal
  tactics: the receiver can renew at a branch or the app they already have
- key: family_member
  role: the receiver's niece or nephew
  goal: ask the receiver to come to a family dinner on Sunday
  tactics: casual, family talk, maybe asks the receiver to bring food
- key: school_teacher
  role: a teacher at the receiver's child's school
  org: โรงเรียน
  goal: tell the receiver about a parent meeting and a school trip fee of {MONEY} paid at school
  tactics: the fee is paid in person at the school office, not by transfer
- key: telesales_legit
  role: sales staff of the receiver's own mobile network
  org: '*'
  goal: offer a cheaper monthly package
  tactics: the receiver can say no; changes are made at a shop or by the official app
- key: landlord_repair
  role: the receiver's landlord
  goal: arrange a time for a plumber to fix the water pipe
  tactics: friendly, asks which day suits, no money
- key: bank_loan_followup
  role: bank loan officer
  org: ธนาคาร
  goal: tell the receiver the loan they applied for is approved and to come to the branch
  tactics: asks the receiver to bring ID to the branch, never asks for a transfer
- key: government_survey
  role: staff of the national statistics office
  org: สำนักงานสถิติแห่งชาติ
  goal: ask a few survey questions about household size and work
  tactics: says answering is voluntary, asks no ID or bank details
# The person who answers. Chosen the same way for scam and normal calls, so how they react
# says nothing about the label. The receiver agent sees every field below as written.
#
# Two ways to set who answers:
#   profiles       people written out in full, each with a `key`. `profile_share` of calls use
#                  one of them, e.g. 0.3 means 3 calls in 10. To make every call in a run use one
#                  person, pass --receiver <key> (or --receiver-file my_person.yaml).
#   the pools      every other call takes one value from each list at random.
# Keep values short and concrete; the agent reads them in English and answers in Thai.
receivers:
  profile_share: 0.3
  profiles:
  - key: teacher_cm
    gender: female
    age: 68
    occupation: retired primary school teacher
    education: bachelor's degree
    region: a small town in Chiang Mai
    family: lives with her husband; her son works in Bangkok
    digital_literacy: uses LINE with family and a banking app her son set up
    scam_awareness: has seen TV warnings but believes she would notice a scam
    temperament: 'trusting: polite to anyone who sounds official'
    ending: says she will ask her son first
    speech: polite and slow, says ค่ะ often, asks people to repeat
  - key: accountant_bkk
    gender: male
    age: 24
    occupation: junior accountant at a Bangkok company
    education: bachelor's degree
    region: Bangkok, rents a condo near the BTS
    family: lives alone
    digital_literacy: banks, shops and pays bills on his phone every day
    scam_awareness: a friend lost money to an investment group last year
    temperament: 'busy: short answers, wants the call over quickly'
    ending: ends the call abruptly
    speech: casual and fast, mixes in English words
  - key: farmer_isan
    gender: male
    age: 55
    occupation: rice farmer
    education: primary school
    region: a village in Roi Et (Isan)
    family: lives with his wife and grandchildren
    digital_literacy: uses phone calls only; a grandchild handles transfers
    scam_awareness: has never heard of call-center scams
    temperament: 'unsure: asks questions, sometimes goes along'
    ending: says he will ask a family member first
    speech: friendly, uses Isan words now and then
  # The profiles below are grounded in real Thai scam-victim data (AOC 1441 and 2024-2025 news):
  # women 21-30 are the single largest victim group (online-shopping fraud, fake jobs, social-media
  # investment); working-age 20-49 see the most cases (jobs, investment); the elderly 60+ lose the
  # most money (call-center / fake-authority, romance, high-yield investment). Even savvy
  # professionals fall. Each profile is internally coherent, so it is a believable person.
  - key: online_shopper_bkk
    gender: female
    age: 24
    occupation: office worker who sells clothes online on the side
    education: bachelor's degree
    region: Bangkok, rents a condo
    family: lives alone
    digital_literacy: shops and banks on her phone many times a day
    scam_awareness: a friend was cheated buying a phone online, but she thinks she is careful
    temperament: 'busy: short answers, wants the call over quickly'
    ending: ends the call to get back to work
    speech: casual and fast, mixes in English words
  - key: jobseeker_grad
    gender: female
    age: 23
    occupation: new graduate looking for work
    education: bachelor's degree
    region: a Bangkok suburb
    family: shares a room with friends
    digital_literacy: lives on social media and chat apps
    scam_awareness: has seen fake job posts but is hopeful about any offer
    temperament: 'unsure: asks a few questions, sometimes goes along'
    ending: says she will think about it and call back
    speech: polite, a little shy
  - key: office_investor
    gender: male
    age: 38
    occupation: mid-level office worker
    education: bachelor's degree
    region: a Bangkok suburb
    family: lives with a spouse and young children
    digital_literacy: banks and trades on apps every day
    scam_awareness: a colleague says he made money trading crypto, so he is curious
    temperament: 'trusting: follows a confident, knowledgeable-sounding caller'
    ending: goes along if the returns sound good
    speech: casual, asks about numbers and returns
  - key: retired_officer
    gender: male
    age: 67
    occupation: retired government officer with a pension
    education: bachelor's degree
    region: a provincial town
    family: lives with his wife
    digital_literacy: uses LINE and a banking app his daughter set up
    scam_awareness: trusts anyone who sounds like an official
    temperament: 'trusting: believes people who sound official, follows instructions'
    ending: goes along with what an official asks
    speech: polite and formal, a little hard of hearing
  - key: widow_alone
    gender: female
    age: 62
    occupation: retired, lives on savings
    education: secondary school
    region: a town in the South
    family: lives alone; her husband passed away
    digital_literacy: uses Facebook and LINE to pass the time
    scam_awareness: lonely and has not heard of romance scams
    temperament: 'trusting but slow: asks the caller to repeat, warms to a kind voice'
    ending: keeps talking to a friendly caller
    speech: chatty, asks personal questions back
  - key: isan_grandma
    gender: female
    age: 71
    occupation: retired rice farmer
    education: primary school
    region: a village in Isan
    family: lives with grown children who help with money
    digital_literacy: uses phone calls only; a grandchild handles transfers
    scam_awareness: has never heard of call-center scams
    temperament: 'unsure: asks questions, sometimes goes along'
    ending: says she will ask a grandchild first
    speech: friendly, uses Isan words now and then
  - key: savvy_professional
    gender: female
    age: 55
    occupation: senior professional in media
    education: master's degree
    region: Bangkok
    family: lives with grown children
    digital_literacy: very comfortable online, uses many apps
    scam_awareness: well-read on scams and sure she would never fall for one
    temperament: 'skeptical: asks who is calling and how to verify'
    ending: checks with the organisation directly
    speech: articulate and confident
  - key: market_vendor_pay
    gender: female
    age: 48
    occupation: fresh-market vendor
    education: secondary school
    region: a province in the Central plains
    family: lives with a spouse
    digital_literacy: uses mobile banking and QR for the stall every day
    scam_awareness: has seen scam news on TV but is always rushed
    temperament: 'busy: gives short answers, wants the call over quickly'
    ending: ends the call abruptly
    speech: blunt and quick
  - key: factory_worker_cb
    gender: male
    age: 29
    occupation: factory worker on shifts
    education: vocational certificate
    region: the Chonburi industrial area
    family: shares a room with friends
    digital_literacy: shops online and plays games on his phone
    scam_awareness: a coworker lost money to an app, so he is wary
    temperament: 'unsure: asks a few questions, sometimes hesitates'
    ending: says he will check first
    speech: casual, short and direct
  - key: nurse_careful
    gender: female
    age: 41
    occupation: nurse on night shifts
    education: bachelor's degree
    region: Chiang Mai
    family: lives with two teenage children
    digital_literacy: uses mobile banking every day
    scam_awareness: reads police warnings and checks numbers
    temperament: 'skeptical: refuses to give personal details on the phone to anyone'
    ending: hangs up and calls the official number
    speech: polite but firm
  - key: student_gamer
    gender: male
    age: 21
    occupation: university student who games and shops online
    education: secondary school
    region: a Bangkok suburb
    family: shares a room with friends
    digital_literacy: lives on his phone, games and online shops daily
    scam_awareness: lost a little to a game top-up page once, thinks he learned his lesson
    temperament: 'unsure: asks a few questions, sometimes goes along'
    ending: says he will check first
    speech: casual, uses slang and English words
  - key: sme_owner
    gender: male
    age: 45
    occupation: owner of a small online shop
    education: vocational certificate
    region: a provincial town
    family: lives with a spouse and young children
    digital_literacy: runs the shop on banking and chat apps all day
    scam_awareness: gets fake supplier and tax calls often, usually busy
    temperament: 'busy: gives short answers, wants the call over quickly'
    ending: ends the call abruptly
    speech: blunt and quick
  - key: delivery_rider
    gender: male
    age: 27
    occupation: food-delivery rider
    education: secondary school
    region: Bangkok, rents a room
    family: lives alone
    digital_literacy: works through delivery and banking apps
    scam_awareness: other riders warned him about loan and job scams
    temperament: 'unsure: asks a few questions, sometimes hesitates'
    ending: says he will think about it
    speech: casual, short and direct
  - key: govt_teacher
    gender: female
    age: 50
    occupation: government school teacher
    education: bachelor's degree
    region: a town in the South
    family: lives with a spouse
    digital_literacy: uses LINE and a banking app
    scam_awareness: respects officials and has savings, not very scam-aware
    temperament: 'trusting: believes people who sound official, follows instructions'
    ending: goes along with what an official asks
    speech: polite and proper
  - key: single_professional
    gender: female
    age: 34
    occupation: marketing manager
