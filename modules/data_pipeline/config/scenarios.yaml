# Call length and pacing.
#   slow_types        scam types that build trust before the first ask
#   reveal_turn_*     the caller's own turn (0 = first) where it may first ask. With these
#                     lists about two thirds of scam calls wait until its turn 2 or later
#                     (speaker turn 4+): the slow-build calls the spec asks for
#   max_turns         [low, high] speaker turns, both sides together
#   caller_knows_name share of calls where the caller already knows the receiver's name
#   min_turns         shorter calls are rejected
calls:
  slow_types:
  - romance
  - investment
  reveal_turn_slow:
  - 2
  - 3
  - 3
  - 4
  reveal_turn_fast:
  - 0
  - 1
  - 1
  - 2
  - 3
  max_turns:
  - 6
  - 14
  caller_knows_name: 1.0  # always: every caller greets the receiver by name in its first line
  min_turns: 4
